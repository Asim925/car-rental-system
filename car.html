<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car details — Veloce Car Rental</title>
  <meta name="description" content="Full specification, gallery and live availability for this Veloce rental car.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="car">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="siteHeader"></header>

  <main id="main">
    <!-- page head is filled by car.js once the car is loaded -->
    <section class="page-head on-dark">
      <div class="container">
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div id="headBlock"></div>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div id="detailRoot"></div>
      </div>
    </section>

    <section class="section section--tight" id="similarSection" style="background:#fff;border-top:1px solid var(--line)">
      <div class="container">
        <div class="section-head">
          <div class="head-text">
            <p class="eyebrow">Same category</p>
            <h2 class="h-md section-title">You might also like</h2>
          </div>
          <a class="link-arrow" href="browse.html">See all cars <span id="arr"></span></a>
        </div>
        <div class="car-grid" id="similarGrid"></div>
      </div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/car.js"></script>
</body>
</html>
